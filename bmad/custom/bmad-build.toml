# ADE overrides for bmad-build (copied into a project's _bmad/custom/). See rules.md sections 1, 3 and 4.
[workflow]
persistent_facts = [
  "The builder model is the one the owner configured (any provider; default Anthropic Opus 5.5). When it is an Anthropic model, launch the implementation subagent with that model (\"opus\" when none is set). When it is not, do not use the Agent tool: stop after the plan and hand the build to the coordinator, which runs it as a focus session on that model.",
  "A story file the owner already approved is the plan: point the plan's context at it instead of restating it, and do not halt at the plan checkpoint; say in one line that the story's approval stands. A high-risk change with no approved story still halts for the owner.",
  "Review scales with the plan's risk (rules.md section 3; missing risk = medium; the highest matching row wins): low = no review lenses; medium = the quick review on the subagent default model (pass no model), one pass, no loopback; high = the thorough review on the builder's model, at most one loopback.",
  "This workflow's review is the code review; do not suggest a separate bmad-code-review. The build's own verification run never makes work Done: the reviewer runs the verification command.",
]
